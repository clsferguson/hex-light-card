<!doctype html><html><head><meta charset=utf-8></head><body>
<pre id="out">running...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m)=>{ out.textContent += m+"\n"; };
const sleep = ms=>new Promise(r=>setTimeout(r,ms));

// Adrian's light RIGHT NOW (live state, 2026-10-07): off, no color -> info.hex null
const STATES = {
  "light.adrian_s_bedroom_lights": {
    entity_id: "light.adrian_s_bedroom_lights",
    state: "off",
    attributes: { friendly_name:"Bedroom Lights", color_mode:null,
      supported_color_modes:["color_temp","hs","xy"], brightness:null, rgb_color:null }
  }
};
let calls=[];
const hass = { states: STATES,
  callService:(d,s,data)=>{calls.push({d,s,data}); return Promise.resolve({});} };

await import("./hex-light-card.js");
const card = document.createElement("hex-light-card");
document.body.appendChild(card);
card.setConfig({ type:"custom:hex-light-card", entity:"light.adrian_s_bedroom_lights" });
card.hass = hass;
await sleep(40);
const hex = card.querySelector('input[type="text"]');
const statusText = () => (card.textContent.match(/Invalid hex[^\n]*/)||[""])[0];
log("initial field: " + JSON.stringify(hex.value));   // expect "#ffffff" (off light)

// A: user is focused + mid-typing a partial value, a hass push arrives
hex.focus();
log("A: activeElement is hex: " + (document.activeElement === hex));
hex.value = "f";
hex.dispatchEvent(new Event("input",{bubbles:true}));
log("A: after typing 'f'  field=" + JSON.stringify(hex.value) + "  status=" + JSON.stringify(statusText()));
card.hass = hass;                    // push during typing
await sleep(30);
log("A: AFTER PUSH(focused) field=" + JSON.stringify(hex.value) + "  status=" + JSON.stringify(statusText()));

// B: same partial value but focus left the field (mobile blur / slip), then push
hex.value = "ff";
hex.dispatchEvent(new Event("input",{bubbles:true}));
document.body.focus();
log("B: activeElement is hex: " + (document.activeElement === hex));
card.hass = hass;                    // push
await sleep(30);
log("B: AFTER PUSH(unfocused) field=" + JSON.stringify(hex.value) + "  status=" + JSON.stringify(statusText()));

// C: per-keystroke error — type 4 valid-ish partials, count how many times error shows
hex.focus();
let flashes = 0;
for (const v of ["1","12","123","1234"]) {
  hex.value = v;
  hex.dispatchEvent(new Event("input",{bubbles:true}));
  if (/Invalid hex/.test(statusText())) flashes++;
}
log("C: 'Invalid hex' flashed on " + flashes + "/4 partial keystrokes");

document.title = "DONE";
</script></html>
