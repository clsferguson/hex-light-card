<!doctype html><html><head><meta charset=utf-8></head><body>
<pre id="out">running...</pre>
<script type="module">
const out = document.getElementById('out');
const log = (m) => { out.textContent += m + "\n"; };
const results = [];
const check = (name, cond, extra="") => { results.push({name, pass: !!cond, extra}); log((cond?"PASS":"FAIL")+" - "+name+(extra?" | "+extra:"")); };
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

// --- mock hass ---
const STATES = {
  "light.adrian_s_bedroom_lights": {
    entity_id: "light.adrian_s_bedroom_lights",
    state: "on",
    attributes: {
      friendly_name: "Bedroom Lights",
      supported_features: 32,
      color_mode: "hs",
      brightness: 255,
      rgb_color: [255,255,255],
      hs_color: [0,0],
    }
  },
  "light.brightness_none": {
    entity_id: "light.brightness_none",
    state: "on",
    attributes: { friendly_name: "NoB", supported_features: 4, color_mode: "hs", rgb_color:[10,20,30] }
  },
  "light.a": { entity_id: "light.a", state: "on", attributes: { friendly_name: "A", supported_color_modes: ["rgb"], rgb_color: [1,2,3], brightness: 200 } },
  "light.b": { entity_id: "light.b", state: "on", attributes: { friendly_name: "B", supported_color_modes: ["rgb"], rgb_color: [4,5,6], brightness: 200 } },
  "light.off_zero": { entity_id: "light.off_zero", state: "off", attributes: { friendly_name: "OffZero", supported_features: 4, color_mode: "hs", brightness: 0 } },
  "light.missing": { entity_id: "light.missing", state: "on", attributes: { friendly_name: "Missing", supported_color_modes: ["rgb"], rgb_color: [7,8,9], brightness: 200 } }
};
let calls = [];
const hass = {
  states: STATES,
  callService: (domain, service, data) => {
    calls.push({domain, service, data});
    return Promise.resolve({});
  }
};

let mod;
try {
  mod = await import("./hex-light-card.js");
  log("module loaded: " + (mod.default ? "default present" : "no default"));
} catch (e) {
  log("MODULE LOAD ERROR: " + e.message);
  document.title = "DONE";
  throw e;
}

// 1. customElements registration
check("hex-light-card defined", !!customElements.get("hex-light-card"));
check("hex-light-card-feature defined", !!customElements.get("hex-light-card-feature"));

// 2. window registrations
check("customCards has hex-light-card", (window.customCards||[]).some(c=>c.type==="hex-light-card"));
check("customCardFeatures has hex-light-card-feature", (window.customCardFeatures||[]).some(c=>c.type==="hex-light-card-feature"));

// helper to create, configure, and wait a tick
async function make(tag, config) {
  const el = document.createElement(tag);
  document.body.appendChild(el);
  el.setConfig(config);
  el.hass = hass;
  await sleep(30);
  return el;
}

// 3. standalone card renders
const card = await make("hex-light-card", { type:"custom:hex-light-card", entity:"light.adrian_s_bedroom_lights" });
const html = card.innerHTML;
check("card renders swatch/current", /Current:/.test(html));
check("card renders hex input", /rrggbb/.test(html) || /<input/.test(html));
const hexInput = card.querySelector('input[type="text"]');
check("card has text hex input", !!hexInput);

// 4. applying a valid hex calls light.turn_on with rgb
calls = [];
hexInput.value = "#00ff88";
hexInput.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("applied call made", calls.length === 1, JSON.stringify(calls));
if (calls[0]) {
  check("service is light.turn_on", calls[0].domain==="light" && calls[0].service==="turn_on");
  check("rgb_color [0,255,136]", JSON.stringify(calls[0].data.rgb_color)==="[0,255,136]", JSON.stringify(calls[0].data));
  check("entity_id group", calls[0].data.entity_id==="light.adrian_s_bedroom_lights");
}

// 5. invalid hex does NOT call service + shows error
calls = [];
hexInput.value = "zzz";
hexInput.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("invalid hex: no service call", calls.length === 0, "calls="+calls.length);
check("invalid hex: error text shown", /Invalid hex/i.test(card.textContent) && /#RGB/.test(card.textContent));

// 5b. invalid 5-char
calls = [];
hexInput.value = "#12345";
hexInput.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("invalid 5-char: no call", calls.length === 0);

// 5c. short hex #abc works
calls = [];
hexInput.value = "#abc";
hexInput.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("short #abc -> [170,187,204]", calls.length===1 && JSON.stringify(calls[0].data.rgb_color)==="[170,187,204]", JSON.stringify(calls[0] && calls[0].data));

// 6. tile feature: no explicit entity -> inherit via parent attr, and shows no title
const featHost = document.createElement("div");
featHost.setAttribute("entity", "light.adrian_s_bedroom_lights");
document.body.appendChild(featHost);
const feat = document.createElement("hex-light-card-feature");
featHost.appendChild(feat);
feat.setConfig({ type:"hex-light-card-feature" });  // no entity
feat.hass = hass;
await sleep(30);
check("feature renders", /<input/.test(feat.innerHTML));
check("feature hides title row", !/Bedroom Lights/.test(feat.innerHTML));
check("feature hides current row by default (v1.1)", !/Current:/.test(feat.innerHTML));
// show_current opt-in: a second feature with explicit true must render it
const feat2Host = document.createElement("div");
feat2Host.setAttribute("entity", "light.adrian_s_bedroom_lights");
document.body.appendChild(feat2Host);
const feat2 = document.createElement("hex-light-card-feature");
feat2Host.appendChild(feat2);
feat2.setConfig({ type:"hex-light-card-feature", show_current:true });
feat2.hass = hass;
await sleep(30);
check("feature shows current row when show_current:true", /Current:/.test(feat2.innerHTML));
// feature apply should target parent entity
calls = [];
const fhex = feat.querySelector('input[type="text"]');
fhex.value = "#ff0000";
fhex.dispatchEvent(new Event("change",{bubbles:true}));
await sleep(40);
check("feature targets parent entity", calls.length===1 && calls[0].data.entity_id==="light.adrian_s_bedroom_lights", JSON.stringify(calls[0]&&calls[0].data));

// 7. group light: entity with comma -> entity_id array
const grp = await make("hex-light-card", { type:"custom:hex-light-card", entity:"light.a, light.b" });
calls = [];
const ghex = grp.querySelector('input[type="text"]');
ghex.value = "#0000ff";
ghex.dispatchEvent(new Event("change",{bubbles:true}));
await sleep(40);
check("group -> entity_id array", calls.length===1 && Array.isArray(calls[0].data.entity_id) && calls[0].data.entity_id.length===2, JSON.stringify(calls[0]&&calls[0].data));

// 8. brightness slider present + sent
const bslider = card.querySelector('input[type="range"]');
check("brightness slider present", !!bslider);

// 9. (fix #1) color picker `change` applies the picked color even without a prior `input`
calls = [];
const cinput = card.querySelector('input[type="color"]');
const hexInput9 = card.querySelector('input[type="text"]');
hexInput9.value = "#000000";            // stale text value
cinput.value = "#336699";               // picked color
cinput.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("fix#1: change applies picked color (no prior input)",
  calls.length===1 && JSON.stringify(calls[0].data.rgb_color)==="[51,102,153]", JSON.stringify(calls[0]&&calls[0].data));

// 10. (fix #5) cancelling the picker (input then blur, no change) reverts the hex field
cinput.value = "#123456";
cinput.dispatchEvent(new Event("click", {bubbles:true}));
cinput.dispatchEvent(new Event("input", {bubbles:true}));
cinput.dispatchEvent(new Event("blur", {bubbles:true}));
await sleep(20);
check("fix#5: cancelled picker reverts hex field to light color", hexInput9.value === "#ffffff", "value=" + hexInput9.value);

// 11. (fix #2) external brightness change is reflected in the slider + payload
STATES["light.adrian_s_bedroom_lights"].attributes.brightness = 100;
card.hass = hass;
await sleep(30);
const bslider11 = card.querySelector('input[type="range"]');
check("fix#2: slider follows external brightness", bslider11.value === "100", "slider=" + bslider11.value);
calls = [];
const hexInput11 = card.querySelector('input[type="text"]');
hexInput11.value = "#aabbcc";
hexInput11.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("fix#2: next apply carries external brightness", calls.length===1 && calls[0].data.brightness === 100, JSON.stringify(calls[0]&&calls[0].data));

// 12. (fix #3) off light with brightness 0 -> no brightness in the payload
// (HA restores its remembered brightness on the next turn_on instead of
// the card forcing the light on at a clamped 1)
const zcard = await make("hex-light-card", { type:"custom:hex-light-card", entity:"light.off_zero" });
calls = [];
const zhex = zcard.querySelector('input[type="text"]');
zhex.value = "#00ff00";
zhex.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("fix#3: off light -> no brightness sent", calls.length===1 && calls[0].data.brightness === undefined, JSON.stringify(calls[0]&&calls[0].data));

// 13. (fix #4) service call goes to the CURRENT hass reference
const callsB = [];
const hassB = {
  states: STATES,
  callService: (domain, service, data) => { callsB.push({domain, service, data}); return Promise.resolve({}); }
};
card.hass = hassB;
await sleep(30);
calls = []; callsB.length = 0;
const hexInput13 = card.querySelector('input[type="text"]');
hexInput13.value = "#112233";
hexInput13.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("fix#4: apply uses current hass reference", callsB.length===1 && calls.length===0, "new=" + callsB.length + " old=" + calls.length);

// 14. (#9-old-name, really #13) 3-char hex TYPED then committed sends real rgb
card.hass = hass;   // test 13 pointed card at hassB
await sleep(30);
calls = [];
const hexInput14 = card.querySelector('input[type="text"]');
hexInput14.value = "abc";              // no "#", 3 chars
hexInput14.dispatchEvent(new Event("input", {bubbles:true}));
hexInput14.dispatchEvent(new Event("change", {bubbles:true}));
await sleep(40);
check("issue#9: 3-char hex 'abc' -> rgb [170,187,204]",
  calls.length===1 && JSON.stringify(calls[0].data.rgb_color)==="[170,187,204]", JSON.stringify(calls[0]&&calls[0].data));

// 15. (#10) clearing the field resets the picker swatch and the error
const cinput15 = card.querySelector('input[type="color"]');
cinput15.value = "#ff0000";
hexInput14.value = "";
hexInput14.dispatchEvent(new Event("input", {bubbles:true}));
await sleep(10);
check("issue#10: cleared field resets picker + error",
  cinput15.value === "#ffffff" && !/Invalid hex/i.test(card.textContent),
  "picker=" + cinput15.value);

// 16. (#12) feature with no entity anywhere: helpful error, no per-push churn
const feat3 = document.createElement("hex-light-card-feature");
document.body.appendChild(feat3);   // no parent with entity attr
feat3.setConfig({ type:"hex-light-card-feature" });
feat3.hass = hass;
await sleep(30);
check("issue#12: no 'Entity not found: undefined'",
  !/Entity not found: undefined/.test(feat3.textContent) && /No light entity found/.test(feat3.textContent),
  feat3.textContent.slice(0, 80));
const rows16 = feat3.querySelectorAll("div > div").length;
const h4 = Object.getOwnPropertyDescriptor(window.HTMLElement.prototype, "innerHTML");
// push the same state again — error row must NOT multiply
feat3.hass = hass;
await sleep(30);
const rows16b = feat3.querySelectorAll("div > div").length;
check("issue#12: no rebuild churn on repeated missing entity", rows16b === rows16, rows16 + " -> " + rows16b);

// 17. (#13) missing entity appears later: card recovers
delete STATES["light.missing"];
const mcard = await make("hex-light-card", { type:"custom:hex-light-card", entity:"light.missing" });
check("issue#13: missing entity shows error row", /Entity not found: light\.missing/.test(mcard.textContent));
STATES["light.missing"] = { entity_id: "light.missing", state: "on", attributes: { friendly_name: "Missing", supported_color_modes: ["rgb"], rgb_color: [7,8,9], brightness: 200 } };
mcard.hass = hass;
await sleep(30);
check("issue#13: recovers when entity appears", /#070809/.test(mcard.textContent) && !/Entity not found/.test(mcard.textContent));

// 18. (#9) Enter then blur-change applies ONCE, not twice
card.hass = hass;   // test 13 pointed card at hassB
calls = [];
await sleep(300);   // outside the 250ms dedupe window
const hexInput18 = card.querySelector('input[type="text"]');
hexInput18.value = "#010203";
hexInput18.dispatchEvent(new Event("keydown", {key: "Enter", bubbles: true}));
hexInput18.dispatchEvent(new Event("change", {bubbles: true}));
await sleep(40);
check("issue#9: Enter + change = one service call", calls.length === 1, "calls=" + calls.length);

// 19. (#10) apply clears the brightnessDirty latch: next external change syncs
const bslider19 = card.querySelector('input[type="range"]');
bslider19.value = "50";
bslider19.dispatchEvent(new Event("input", {bubbles: true}));
await sleep(300);
calls = [];
hexInput18.value = "#040506";
hexInput18.dispatchEvent(new Event("change", {bubbles: true}));
await sleep(40);                       // apply resolves -> latch cleared
STATES["light.adrian_s_bedroom_lights"].attributes.brightness = 200;
card.hass = hass;
await sleep(30);
check("issue#10: after apply, external brightness re-syncs slider", bslider19.value === "200", "slider=" + bslider19.value);
calls = [];
hexInput18.value = "#07080a";
hexInput18.dispatchEvent(new Event("change", {bubbles: true}));
await sleep(40);
check("issue#10: next apply carries the external brightness", calls.length===1 && calls[0].data.brightness === 200, JSON.stringify(calls[0]&&calls[0].data));

// 20. (#12) blur rollback keeps a TYPED value (picker session open, no commit)
const cinput20 = card.querySelector('input[type="color"]');
cinput20.dispatchEvent(new Event("click", {bubbles: true}));   // open pick session
hexInput18.value = "#102030";
hexInput18.dispatchEvent(new Event("input", {bubbles: true})); // user types
cinput20.dispatchEvent(new Event("blur", {bubbles: true}));    // cancel/blur
await sleep(20);
check("issue#12: typed value survives unconfirmed-picker blur", hexInput18.value === "#102030", "value=" + hexInput18.value);

// 21. (#13) hash-less 6-char hex is typable end-to-end
calls = [];
await sleep(300);
hexInput18.value = "0f1e2d";
hexInput18.dispatchEvent(new Event("input", {bubbles: true}));
hexInput18.dispatchEvent(new Event("change", {bubbles: true}));
await sleep(40);
check("issue#13: hash-less '0f1e2d' applies [15,30,45]",
  calls.length===1 && JSON.stringify(calls[0].data.rgb_color)==="[15,30,45]", JSON.stringify(calls[0]&&calls[0].data));

// 22. (#14) clearing the field resets picker + clears error
cinput20.value = "#ff0000";
hexInput18.value = "";
hexInput18.dispatchEvent(new Event("input", {bubbles: true}));
await sleep(10);
check("issue#14: cleared field -> picker #ffffff, no error",
  cinput20.value === "#ffffff" && !/Invalid hex/i.test(card.textContent), "picker=" + cinput20.value);

const failed = results.filter(r=>!r.pass);
log("\n==== " + (results.length - failed.length) + "/" + results.length + " passed ====");
log(failed.length ? "FAILURES:\n" + failed.map(f=>f.name+" | "+f.extra).join("\n") : "ALL GREEN");
document.title = "DONE:" + (failed.length ? "FAIL" : "PASS");
</script></html>
